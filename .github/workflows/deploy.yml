name: Deploy Etokisana API

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PORT: "4243"
  DOCKER_IMAGE: commercegestion-api
  DOCKER_CONTAINER_NAME: commercegestion-api
  DOCKER_BUILDKIT: "1"
  NODE_ENV: development
  JWT_EXPIRES_IN: 15m
  JWT_REFRESH_EXPIRES_IN: 7d
  SMTP_SECURE: "true"
  SMTP_FROM_NAME: Etokisana
  MAIL_SEND_DELAY_MS: "300"
  MAIL_MAX_RETRIES: "3"
  APP_NAME: Etokisana
  APP_URL: http://api.commercegestion.online
  CORS_ALLOWLIST: http://localhost:3000,https://commercegestion.com,https://www.commercegestion.com,http://api.commercegestion.online,http://commercegestion.online
  FRONTEND_URL: https://commercegestion.online
  FRONT_URL: https://commercegestion.online

jobs:
  deploy:
    name: Build and deploy
    runs-on: self-hosted
    env:
      DOCKER_TAG: ${{ github.run_number }}
      MONGO_URI: ${{ secrets.MONGO_URI_ETOKISANA }}
      JWT_SECRET: ${{ secrets.JWT_SECRET_E_TAKALO }}
      JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET_E_TAKALO }}
      SMTP_HOST: ${{ secrets.SMTP_HOST_E_TAKALO }}
      SMTP_PORT: ${{ secrets.SMTP_PORT_E_TAKALO }}
      SMTP_USER: ${{ secrets.SMTP_USER_E_TAKALO }}
      SMTP_PASS: ${{ secrets.SMTP_PASS_E_TAKALO }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL_E_TAKALO }}
      SUPERADMIN_EMAIL: ${{ secrets.SUPERADMIN_EMAIL_E_TAKALO }}
      SUPERADMIN_PASSWORD: ${{ secrets.SUPERADMIN_PASSWORD_E_TAKALO }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t "$DOCKER_IMAGE:$DOCKER_TAG" .

      - name: Deploy with rollback
        shell: bash
        run: |
          if docker ps -a --format '{{.Names}}' | grep -qx "$DOCKER_CONTAINER_NAME"; then
            docker rm -f "${DOCKER_CONTAINER_NAME}_backup" 2>/dev/null || true
            docker stop "$DOCKER_CONTAINER_NAME" || true
            docker rename "$DOCKER_CONTAINER_NAME" "${DOCKER_CONTAINER_NAME}_backup"
          fi

          docker volume create "${DOCKER_CONTAINER_NAME}_upload" >/dev/null

          docker run -d \
            --name "$DOCKER_CONTAINER_NAME" \
            --restart unless-stopped \
            --memory=4g \
            --memory-reservation=2g \
            --cpus=4 \
            --pids-limit=200 \
            -p "$PORT:$PORT" \
            -e PORT \
            -e MONGO_URI \
            -e NODE_ENV \
            -e JWT_SECRET \
            -e JWT_EXPIRES_IN \
            -e JWT_REFRESH_SECRET \
            -e JWT_REFRESH_EXPIRES_IN \
            -e SMTP_HOST \
            -e SMTP_PORT \
            -e SMTP_USER \
            -e SMTP_PASS \
            -e SMTP_FROM="$SMTP_USER" \
            -e SMTP_SECURE \
            -e SMTP_FROM_NAME \
            -e MAIL_SEND_DELAY_MS \
            -e MAIL_MAX_RETRIES \
            -e APP_NAME \
            -e APP_URL \
            -e ADMIN_EMAIL \
            -e CORS_ALLOWLIST \
            -e FRONTEND_URL \
            -e FRONT_URL \
            -e SUPERADMIN_EMAIL \
            -e SUPERADMIN_PASSWORD \
            -v "${DOCKER_CONTAINER_NAME}_upload:/app/upload" \
            "$DOCKER_IMAGE:$DOCKER_TAG"

          sleep 15

          if docker ps --format '{{.Names}}' | grep -qx "$DOCKER_CONTAINER_NAME"; then
            docker rm -f "${DOCKER_CONTAINER_NAME}_backup" 2>/dev/null || true
          else
            docker rm -f "$DOCKER_CONTAINER_NAME" 2>/dev/null || true
            if docker ps -a --format '{{.Names}}' | grep -qx "${DOCKER_CONTAINER_NAME}_backup"; then
              docker rename "${DOCKER_CONTAINER_NAME}_backup" "$DOCKER_CONTAINER_NAME"
              docker start "$DOCKER_CONTAINER_NAME"
            fi
            exit 1
          fi

      - name: Remove unused Docker images
        if: always()
        run: docker image prune -a -f || true
