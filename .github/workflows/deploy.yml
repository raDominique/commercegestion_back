name: Deploy Etokisana API

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PORT: "4243"
  DOCKER_IMAGE: commercegestion-api
  DOCKER_CONTAINER_NAME: commercegestion-api
  DOCKER_BUILDKIT: "1"
  NODE_ENV: development
  JWT_EXPIRES_IN: 15m
  JWT_REFRESH_EXPIRES_IN: 7d
  SMTP_SECURE: "true"
  SMTP_FROM_NAME: Etokisana
  MAIL_SEND_DELAY_MS: "300"
  MAIL_MAX_RETRIES: "3"
  APP_NAME: Etokisana
  APP_URL: http://api.commercegestion.online
  CORS_ALLOWLIST: http://localhost:3000,https://commercegestion.com,https://www.commercegestion.com,http://api.commercegestion.online,http://commercegestion.online
  FRONTEND_URL: https://commercegestion.online
  FRONT_URL: https://commercegestion.online

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    env:
      DOCKER_TAG: ${{ github.run_number }}
      REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git
      MONGO_URI: ${{ secrets.MONGO_URI_ETOKISANA }}
      JWT_SECRET: ${{ secrets.JWT_SECRET_E_TAKALO }}
      JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET_E_TAKALO }}
      SMTP_HOST: ${{ secrets.SMTP_HOST_E_TAKALO }}
      SMTP_PORT: ${{ secrets.SMTP_PORT_E_TAKALO }}
      SMTP_USER: ${{ secrets.SMTP_USER_E_TAKALO }}
      SMTP_PASS: ${{ secrets.SMTP_PASS_E_TAKALO }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL_E_TAKALO }}
      SUPERADMIN_EMAIL: ${{ secrets.SUPERADMIN_EMAIL_E_TAKALO }}
      SUPERADMIN_PASSWORD: ${{ secrets.SUPERADMIN_PASSWORD_E_TAKALO }}

    steps:
      - name: Deploy on server with rollback
        uses: appleboy/ssh-action@v1.0.3
        env:
          PORT: ${{ env.PORT }}
          DOCKER_IMAGE: ${{ env.DOCKER_IMAGE }}
          DOCKER_TAG: ${{ env.DOCKER_TAG }}
          DOCKER_CONTAINER_NAME: ${{ env.DOCKER_CONTAINER_NAME }}
          REPOSITORY_URL: ${{ env.REPOSITORY_URL }}
          NODE_ENV: ${{ env.NODE_ENV }}
          JWT_EXPIRES_IN: ${{ env.JWT_EXPIRES_IN }}
          JWT_REFRESH_EXPIRES_IN: ${{ env.JWT_REFRESH_EXPIRES_IN }}
          SMTP_SECURE: ${{ env.SMTP_SECURE }}
          SMTP_FROM_NAME: ${{ env.SMTP_FROM_NAME }}
          MAIL_SEND_DELAY_MS: ${{ env.MAIL_SEND_DELAY_MS }}
          MAIL_MAX_RETRIES: ${{ env.MAIL_MAX_RETRIES }}
          APP_NAME: ${{ env.APP_NAME }}
          APP_URL: ${{ env.APP_URL }}
          CORS_ALLOWLIST: ${{ env.CORS_ALLOWLIST }}
          FRONTEND_URL: ${{ env.FRONTEND_URL }}
          FRONT_URL: ${{ env.FRONT_URL }}
          MONGO_URI: ${{ env.MONGO_URI }}
          JWT_SECRET: ${{ env.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ env.JWT_REFRESH_SECRET }}
          SMTP_HOST: ${{ env.SMTP_HOST }}
          SMTP_PORT: ${{ env.SMTP_PORT }}
          SMTP_USER: ${{ env.SMTP_USER }}
          SMTP_PASS: ${{ env.SMTP_PASS }}
          ADMIN_EMAIL: ${{ env.ADMIN_EMAIL }}
          SUPERADMIN_EMAIL: ${{ env.SUPERADMIN_EMAIL }}
          SUPERADMIN_PASSWORD: ${{ env.SUPERADMIN_PASSWORD }}
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: PORT,DOCKER_IMAGE,DOCKER_TAG,DOCKER_CONTAINER_NAME,REPOSITORY_URL,NODE_ENV,JWT_EXPIRES_IN,JWT_REFRESH_EXPIRES_IN,SMTP_SECURE,SMTP_FROM_NAME,MAIL_SEND_DELAY_MS,MAIL_MAX_RETRIES,APP_NAME,APP_URL,CORS_ALLOWLIST,FRONTEND_URL,FRONT_URL,MONGO_URI,JWT_SECRET,JWT_REFRESH_SECRET,SMTP_HOST,SMTP_PORT,SMTP_USER,SMTP_PASS,ADMIN_EMAIL,SUPERADMIN_EMAIL,SUPERADMIN_PASSWORD
          script: |
            set -e
            APP_DIR=/home/${{ secrets.SSH_USER }}/commercegestion
            if [ -d "$APP_DIR/.git" ]; then
              git -C "$APP_DIR" pull --ff-only origin main
            else
              git clone --branch main --single-branch "$REPOSITORY_URL" "$APP_DIR"
            fi
            cd "$APP_DIR"
            docker build -t "$DOCKER_IMAGE:$DOCKER_TAG" .

            if docker ps -a --format '{{.Names}}' | grep -qx "$DOCKER_CONTAINER_NAME"; then
              docker rm -f "${DOCKER_CONTAINER_NAME}_backup" 2>/dev/null || true
              docker stop "$DOCKER_CONTAINER_NAME" || true
              docker rename "$DOCKER_CONTAINER_NAME" "${DOCKER_CONTAINER_NAME}_backup"
            fi

            docker volume create "${DOCKER_CONTAINER_NAME}_upload" >/dev/null

            docker run -d \
              --name "$DOCKER_CONTAINER_NAME" \
              --restart unless-stopped \
              --memory=4g \
              --memory-reservation=2g \
              --cpus=4 \
              --pids-limit=200 \
              -p "$PORT:$PORT" \
              -e PORT \
              -e MONGO_URI \
              -e NODE_ENV \
              -e JWT_SECRET \
              -e JWT_EXPIRES_IN \
              -e JWT_REFRESH_SECRET \
              -e JWT_REFRESH_EXPIRES_IN \
              -e SMTP_HOST \
              -e SMTP_PORT \
              -e SMTP_USER \
              -e SMTP_PASS \
              -e SMTP_FROM="$SMTP_USER" \
              -e SMTP_SECURE \
              -e SMTP_FROM_NAME \
              -e MAIL_SEND_DELAY_MS \
              -e MAIL_MAX_RETRIES \
              -e APP_NAME \
              -e APP_URL \
              -e ADMIN_EMAIL \
              -e CORS_ALLOWLIST \
              -e FRONTEND_URL \
              -e FRONT_URL \
              -e SUPERADMIN_EMAIL \
              -e SUPERADMIN_PASSWORD \
              -v "${DOCKER_CONTAINER_NAME}_upload:/app/upload" \
              "$DOCKER_IMAGE:$DOCKER_TAG"

            sleep 15

            if docker ps --format '{{.Names}}' | grep -qx "$DOCKER_CONTAINER_NAME"; then
              docker rm -f "${DOCKER_CONTAINER_NAME}_backup" 2>/dev/null || true
            else
              docker rm -f "$DOCKER_CONTAINER_NAME" 2>/dev/null || true
              if docker ps -a --format '{{.Names}}' | grep -qx "${DOCKER_CONTAINER_NAME}_backup"; then
                docker rename "${DOCKER_CONTAINER_NAME}_backup" "$DOCKER_CONTAINER_NAME"
                docker start "$DOCKER_CONTAINER_NAME"
              fi
              exit 1
            fi

            docker image prune -a -f || true
